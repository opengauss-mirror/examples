spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/${DB_NAME:mysql_test_db}?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8
    username: ${DB_USER:mysql_test_db}
    password: ${DB_PASSWORD:ChangeMe_123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 表由 SQL 脚本创建，不让 Hibernate 建表/改表；ddl-auto 行为是后续专项测试点
    hibernate:
      ddl-auto: none
    # 走 MySQL 协议。自定义方言声明 B 模式"无反斜杠转义"语义，见 OpenGaussBMySQLDialect。
    # LIKE 查询的规避：JPQL 显式 escape '!'（B 模式不认 '\\' 单字符转义，见 UserRepository）
    database-platform: org.opengauss.smoke.OpenGaussBMySQLDialect
    show-sql: true
