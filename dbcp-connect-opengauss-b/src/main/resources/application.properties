spring.application.name=dbcp-connect-opengauss-b

# Spring Boot 默认会优先选择 HikariCP；pom.xml 已排除 HikariCP，下面再显式指定 DBCP2。
spring.datasource.type=org.apache.commons.dbcp2.BasicDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DBCP_URL:jdbc:mysql://127.0.0.1:3308/mysql_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf-8&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DBCP_USER:opengauss}
spring.datasource.password=${DBCP_PASSWORD:change_me}

# DBCP2 连接池参数
spring.datasource.dbcp2.initial-size=2
spring.datasource.dbcp2.max-total=8
spring.datasource.dbcp2.max-idle=8
spring.datasource.dbcp2.min-idle=2
spring.datasource.dbcp2.max-wait-millis=5000
spring.datasource.dbcp2.validation-query=SELECT 1
spring.datasource.dbcp2.test-on-borrow=true
spring.datasource.dbcp2.test-while-idle=true
# testWhileIdle 只有在维护线程周期大于 0 时才会执行空闲连接校验。
spring.datasource.dbcp2.time-between-eviction-runs-millis=60000
spring.datasource.dbcp2.min-evictable-idle-time-millis=300000

# 业务示例由代码显式执行 SQL，不让 Spring Boot 自动执行未审核的脚本。
spring.sql.init.mode=never
