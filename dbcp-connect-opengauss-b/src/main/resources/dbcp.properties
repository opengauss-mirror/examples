# ============ 驱动与连接 ============
# MySQL JDBC 驱动（本示例固定使用已验证的 8.0.28）
driverClassName=com.mysql.cj.jdbc.Driver
# dolphin 协议监听端口 + B 兼容库下的 schema 名
# 本地示例的 Dolphin MySQL 协议端口未启用 SSL，因此设置 useSSL=false
url=jdbc:mysql://127.0.0.1:3308/mysql_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf-8&zeroDateTimeBehavior=CONVERT_TO_NULL
username=opengauss
password=<DBCP_PASSWORD>

# ============ 池容量参数 ============
initialSize=2
maxTotal=8
maxIdle=8
minIdle=2
maxWaitMillis=5000

# ============ 连接校验 ============
validationQuery=SELECT 1
testOnBorrow=true
testWhileIdle=true
timeBetweenEvictionRunsMillis=60000
minEvictableIdleTimeMillis=300000

# ============ 防连接泄漏 ============
removeAbandonedOnBorrow=false
removeAbandonedTimeout=300
